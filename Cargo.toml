[package]
name = "discord-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["form"] }
base64 = "0.23.1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
getrandom = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "rustls"] }
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "signal", "net", "time", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"
