# Optional drop-in. Review paths and configure non-secret values first.
# The encrypted credential must already exist and be managed independently.
[Service]
LoadCredentialEncrypted=ciphera_token:/etc/credstore.encrypted/discord-mcp-ciphera-token
EnvironmentFile=/etc/discord-mcp/ciphera.env
ExecStart=
ExecStart=/bin/sh -c ': "$${CIPHERA_PROJECT:?missing project}" "$${CIPHERA_ENV:?missing environment}"; [ -z "$${DISCORD_MCP_KEY+x}" ] && [ -z "$${DISCORD_MCP_DISCORD_CLIENT_SECRET+x}" ] || { echo "Remove legacy application secrets from service environment" >&2; exit 1; }; token="$$( /usr/bin/cat "$${CREDENTIALS_DIRECTORY}/ciphera_token" )" || exit 1; [ -n "$$token" ] || exit 1; exec 3>&2; CIPHERA_TOKEN="$$token" exec /usr/local/bin/ciphera run --project "$$CIPHERA_PROJECT" --env "$$CIPHERA_ENV" -- /bin/sh -c "exec 2>&3 3>&-; exec /usr/local/bin/discord-mcp serve" 2>/dev/null'
